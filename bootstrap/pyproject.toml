[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "lingxi-identity-bootstrap"
version = "0.1.0"
description = "Idempotent Logto bootstrap for LingxiIdentity"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "click>=8.3.3,<9",
]

[tool.setuptools]
py-modules = ["cli", "manifest"]
