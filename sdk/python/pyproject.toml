[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "LingxiIdentity"
version = "0.1.0"
description = "Provider-neutral Python SDK for LingxiIdentity"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "LingXi-Org"}]
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28,<0.29",
  "pydantic>=2.10,<3",
  "PyJWT[crypto]>=2.10,<3",
  "cryptography>=50,<51",
  "idna>=3.15,<4",
  "anyio>=4.8,<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
