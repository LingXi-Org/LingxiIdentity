[build-system]
requires = ["setuptools>=84"]
build-backend = "setuptools.build_meta"

[project]
name = "lingxi-identity-bff"
version = "0.1.0"
description = "FastAPI management BFF for LingxiIdentity"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "httpx>=0.28,<0.29",
  "authlib>=1.4,<2",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.14.2,<3",
  "itsdangerous>=2.2,<3",
  "cryptography>=50,<51",
  "idna>=3.15,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
